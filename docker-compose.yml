services:
  grok-browser:
    build:
      context: ./browser
    shm_size: "2gb"
    ports:
      - "6080:6080"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-seat-browser}
    volumes:
      - grok-browser-profile:/profile
    restart: unless-stopped

  private-seat:
    build: .
    ports:
      - "8080:8080"
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SEAT_LAN: "1"
      PGLITE_DATA_DIR: /data
      GROK_BROWSER_CDP: http://grok-browser:9222
    volumes:
      - private-seat-data:/data
    depends_on:
      - grok-browser
    restart: unless-stopped

volumes:
  private-seat-data:
  grok-browser-profile: